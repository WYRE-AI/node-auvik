name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Read-scoped on purpose: this job runs `npm ci` and therefore executes
    # every installed dependency's lifecycle scripts. It must never hold a
    # write-scoped credential. This package has no @wyre-ai-scoped
    # dependencies (only public packages), so no registry auth is needed
    # here at all -- that's what made the previous single-job setup's
    # `.npmrc` token write before `npm ci` unnecessary as well as unsafe.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # No git push happens from this job, so there's no reason for even
          # a read-scoped credential to sit on disk during npm ci -- same
          # principle as the release job below, applied to the checkout this
          # PR's diff itself touches (CodeRabbit, WYRE-AI/node-auvik#41).
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Archive release payload
        # upload-artifact zips loose files and does NOT preserve Unix file
        # permissions across that step (all files come back mode 644,
        # directories 755 -- see actions/upload-artifact's own README,
        # "Permission loss" section) -- so node_modules/.bin/semantic-release
        # would lose its executable bit and `npx semantic-release` would
        # fail in the release job below. Tar the payload ourselves first;
        # tar's own format preserves modes, and only the single tarball
        # (not its contents) goes through the lossy zip step.
        run: tar -czf release-payload.tar.gz dist node_modules package.json package-lock.json
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build
          path: release-payload.tar.gz
          retention-days: 1

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    # Write-scoped only here, and only for the final release step below.
    # No dependency install happens in this job -- node_modules comes from
    # the build job's artifact -- so there is no untrusted lifecycle-script
    # execution surface for the write-scoped token to leak through.
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Write-scoped credential removed for the same reason as before
          # (CWE-250): semantic-release authenticates its own git and API
          # calls from GITHUB_TOKEN directly, via the Release step's env
          # below, and never needs the persisted checkout credential.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@wyre-ai'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build
          path: .
      - name: Extract release payload
        # Untar restores the exact modes the build job set, including
        # node_modules/.bin/semantic-release's executable bit -- see the
        # matching comment on the build job's archive step.
        run: tar -xzf release-payload.tar.gz
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
